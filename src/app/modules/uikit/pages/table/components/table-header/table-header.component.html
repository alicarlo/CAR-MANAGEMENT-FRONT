<ng-container>
  <th [ngClass]="tableDensityService.classes().checkboxHead">
    <input (change)="toggle($event)" class="checkbox checkbox-sm" data-datatable-check="true" type="checkbox" />
  </th>

  <ng-container *ngFor="let col of columns">
    <th [ngClass]="tableDensityService.classes().th">{{ col }}</th>
  </ng-container>
  <th [ngClass]="[tableDensityService.classes().checkboxHead, stickyActions ? 'sticky right-0 z-10 bg-card ]' : '']"></th> 
</ng-container>
