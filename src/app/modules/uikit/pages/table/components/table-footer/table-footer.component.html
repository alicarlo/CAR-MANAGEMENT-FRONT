<div [hidden]="!_activateSearch" [ngClass]="['text-muted-foreground', tableDensityService.classes().footer]">
  <div [ngClass]="tableDensityService.classes().footerPrimary">
    Ver
    <select [ngClass]="tableDensityService.classes().footerSelect"
      [(ngModel)]="pageSize"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="onPageSizeChange($any($event))"
    >
      <option *ngFor="let option of pageSizeOptions" [ngValue]="option">{{ option }}</option>
    </select>
    por pagina
  </div>
  <div [ngClass]="tableDensityService.classes().footerSecondary">
    <span>1-{{showItems}} of {{total}}</span>
    <div [ngClass]="tableDensityService.classes().footerPagination">
      <button
        (click)="changePageNextPrev('prev')"
        [ngClass]="[tableDensityService.classes().footerIconButton, !hasPrev ? '!cursor-not-allowed' : '!cursor-pointer']"
        [disabled]="!hasPrev">
        <svg-icon src="./assets/icons/heroicons/outline/arrow-long-left.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
      </button>
      
      <!--*ngFor="let p of pages"-->
      <button
        
        *ngFor="let p of visiblePages; trackBy: trackByPage"
        [ngClass]="[tableDensityService.classes().footerPageButton, p === currentPageSelect ? 'bg-muted-foreground/10' : 'hover:bg-muted-foreground/50']"
        (click)="goToPage(p)">
        {{ p }}
      </button>
      
      <button
        (click)="changePageNextPrev('next')"
        [ngClass]="[tableDensityService.classes().footerIconButton, !hasNext ? '!cursor-not-allowed' : '!cursor-pointer']"
        [disabled]="!hasNext">
        <svg-icon src="./assets/icons/heroicons/outline/arrow-long-right.svg" [svgClass]="'h-4 w-4'"> </svg-icon>
      </button>
    </div>
  </div>
</div>
