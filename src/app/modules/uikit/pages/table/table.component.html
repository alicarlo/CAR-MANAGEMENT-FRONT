
<div class="mb-4 flex justify-between" *ngIf="flag === true">
  <div class="inline-block">
    <h3 class="text-foreground font-semibold">Team Members</h3>
    <div class="text-muted-foreground space-x-1 text-xs font-medium">
      <a href="" class="hover:text-primary">All Members:</a>
      <span class="text-foreground">49,053</span>
    </div>
  </div>
  <div class="inline-block space-x-4">
    <button
      class="bg-muted text-muted-foreground hover:text-foreground flex-none rounded-md px-4 py-2.5 text-xs font-semibold">
      Import CSV
    </button>
    <button class="bg-primary text-primary-foreground flex-none rounded-md px-4 py-2.5 text-xs font-semibold">
      Add Member
    </button>
  </div>
</div>

<div
  [ngClass]="['border-muted/20 bg-background flex min-w-full flex-col', tableDensityService.classes().wrapper]"
  [ngStyle]="tableDensityService.variables()"
>
  <app-table-action 
    [labelName]="labelName" 
    [select]="select"
    [selectValueDefault]="_selectValueDefault"
    [selectData]="_selectData"
    [selectValue]="selectValue"
    [selectId]="selectId"
    [selectPlaceholder]="selectPlaceholder"
    [searchable]="searchable"
    [size]="size"
    (selectOption)=selectOption($event) 
  ></app-table-action>
  <div
    *ngIf="loading === true && error === false"
    [ngClass]="['scrollbar-thumb-rounded scrollbar-track-rounded scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted', tableDensityService.classes().scroll]">
    <table
      [ngClass]="['text-muted-foreground leading-5', tableDensityService.classes().table]"
      ><!--class="text-muted-foreground table w-full table-auto border-collapse border-0 text-left align-middle leading-5"-->
      <thead [ngClass]="['border-muted/20 text-muted-foreground', tableDensityService.classes().thead]">
        <tr app-table-header [columns]="headers"  (onCheck)="toggleUsers($event)"></tr>
      </thead>
      <tbody>
        @for (item of filteredData(); track $index) {
          <tr 
            app-table-row 
            [ngClass]="tableDensityService.classes().row"
            [data]="item"  
            [dataFilterColumns]="dataFilterColumns"
            [actions]="actions"
            (action)="onRowAction($event)">
            >
          </tr>
        } @empty {
          <tr>
            <td class="py-4 text-center text-sm" colspan="7">No hay datos</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div *ngIf="loading === false" class="w-full h-[315px] flex items-center justify-center">
    <app-loading *ngIf="select === false"></app-loading>
    <div *ngIf="select === true">
      <div *ngIf="!selectOptionFilter">
         <p class="text-foreground">Seleccione un filtro</p>
      </div>

      <div *ngIf="!!selectOptionFilter">
         <app-loading ></app-loading>
      </div>
    </div>
     
  </div>

  <div *ngIf="error === true" class="w-full h-[315px] flex items-center justify-center">
    <p class="text-foreground">Problemas al cargar los datos</p>
  </div>
  <app-table-footer 
    (pageSizeSelectChild)=pageSizeSelect($event) 
    (changePageNextPrevChild)="changePageNextPrev($event)"
    (currentPageChild)="currentPageTable($event)"
    [hasNext]="hasNext"
    [hasPrev]="hasPrev"
    [total]="total"
    [pages]="pages"
    [totalPages]="totalPages"
    [anchorsNext]="anchorsNextArray"
    [currentPage]="currentPageSelect"
    [pageSizeOptions]="pageSizeOptions"
    [activateSearch]="activateSearch" 
    ></app-table-footer>
</div>
