<mat-dialog-content>
  <div class="p-[20px]" *ngIf="loadingModal">
    <div  class="flex flex-col gap-4">
      <p class="text-foreground font-semibold">Abonos</p>
      <div
        class="border border-border/60 rounded-lg bg-card m-[25px]
              max-h-[310px] overflow-y-auto overflow-x-auto"
      >
        <table class="w-full table-fixed">
          <thead>
            <tr class="bg-muted/20 text-foreground/70 text-[11px] uppercase tracking-wide">
              <th class="px-3 py-2 text-left"># Abono</th>
              <th class="px-3 py-2 text-left">Fecha de Abono</th>
              <th class="px-3 py-2 text-left">Importe Abono</th>
              <th class="px-3 py-2 text-left">Cliente</th>
              <th class="px-3 py-2 text-left">Auto</th>
              <th class="px-3 py-2 text-left">Vendedor</th>
              <th class="px-3 py-2 text-left">Acciones</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-border/40" *ngIf="!income">
            <div class="text-foreground text-[12px] leading-tight"></div>
          </tbody>
          <tbody class="divide-y divide-border/40" *ngIf="!!income">

            <tr
              *ngFor="let item of income"
              class="text-foreground text-[12px] leading-tight hover:bg-background/60 transition"
            >
              <td class="px-3 py-2 align-center">
                <div class="min-w-0 whitespace-normal break-words [hyphens:auto] text-left">
                  {{ item.idIncome }}
                </div>
              </td>

              
               <td class="px-3 py-2 align-middle">
                <div class="min-w-0 whitespace-normal break-words [hyphens:auto] text-left">
                  {{ item.dateIncome | date:'dd/MM/yyyy' }}
                </div>
              </td>

              <td class="px-3 py-2 align-middle text-left">
                {{ item.amount | currency:'MXN':'symbol':'1.2-2':'en-US' }}
              </td>

               <td class="px-3 py-2 align-middle">
                <div class="min-w-0 whitespace-normal break-words [hyphens:auto] text-left">
                  {{ item.client }}
                </div>
              </td>

              <td class="px-3 py-2 align-middle">
                <div class="min-w-0 whitespace-normal break-words [hyphens:auto] text-left">
                  {{ item.car }}
                </div>
              </td>

               <td class="px-3 py-2 align-middle">
                <div class="min-w-0 whitespace-normal break-words [hyphens:auto] text-left">
                  {{ item.seller }}
                </div>
              </td>

              <td class="px-2 py-1 align-middle">
                <div class="flex items-center justify-start gap-1">
                  <button 
                    (click)="openTicketModal(item)"
                    mat-icon-button aria-label="Descargar"
                    matTooltip="Descargar Ticket"
                    matTooltipPosition="above"
                    matTooltipClass="bg-background text-foreground"        
                  >
                    <mat-icon class="!text-foreground/80 text-[18px] leading-none">confirmation_number</mat-icon>
                  </button>
    
                  <button mat-icon-button aria-label="Editar" 
                    (click)="openAddModal('edit', item)"
                    matTooltip="Editar Abono"
                    matTooltipPosition="above"
                    matTooltipClass="bg-background text-foreground" 
                  >
                    <mat-icon class="!text-foreground/80 text-[18px] leading-none">edit</mat-icon>
                  </button>
                  <button mat-icon-button color="warn" aria-label="Eliminar"
                    (click)="actionModal('edit', item, 'Desea  elimnar el registro?')"
                    matTooltip="Eliminar Abono"
                    matTooltipPosition="above"
                    matTooltipClass="bg-background text-foreground" 
                          >
                    <mat-icon class="!text-foreground/80 text-[18px] leading-none">delete</mat-icon>
                  </button>


                  <button 
                    *ngIf="item.document && objectKeys(item.document).length > 0"
                     mat-icon-button 
                    aria-label="Descargar"
                    matTooltip="Descargar Archivo"
                    matTooltipPosition="above"
                    matTooltipClass="bg-background text-foreground"        
                    (click)="actionModalFile(1,'delete', item, 'Desea descargar el archivo?')"
                  >
                    <mat-icon class="!text-foreground/80 text-[18px] leading-none">attach_file</mat-icon>
                  </button>
                </div>
              </td>

            </tr>
          </tbody>
        </table>
      </div>

      <div class="text-foreground text-[15px]  w-full flex justify-center items-center" *ngIf="income.length === 0">
        No hay abonos
      </div>
    </div>
  </div>

  <div *ngIf="!loadingModal" class="h-full flex justify-center items-center">
    <app-loading></app-loading>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div class="flex gap-2 p-[20px]">
    <app-button  mat-dialog-close full impact="bold" tone="primary" shape="rounded" size="medium">Cerrar</app-button>
  </div>
</mat-dialog-actions>
