<mat-dialog-content>
  <div class="p-[20px]">
    <div  class="flex flex-col gap-4">
      <p class="text-foreground font-semibold">Prorroga</p>
      <div>
        <form  [formGroup]="saveForm" class="flex flex-col gap-6">
          <div class="">
            
            <div class="flex flex-col gap-2">
              <p class="text-foreground text-[11px] font-medium">Fecha de pago:</p>
              <div class="relative">
                 <input
                    #dob
                    type="date"
                    class="py-2 pl-8 pr-2"
                    formControlName="paid_at"   
                  />

                <button 
                  type="button"
                  class="absolute right-2 top-1/2 -translate-y-1/2 text-foreground flex items-center justify-center"
                  (click)="openPicker(dob)"
                  >
                  <mat-icon style="font-size: 20px;">calendar_month</mat-icon>
                </button>
              </div>
              <div class="error-messages">
                <ng-container *ngFor="let error of error_messages.paid_at">
                  <div class="error-message" *ngIf="saveForm.get('paid_at').hasError(error.type) && (saveForm.get('paid_at').dirty || saveForm.get('paid_at').touched)">
                    {{error.message}}
                  </div>
                </ng-container>
              </div>
            </div>
            
          </div>

        </form>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div class="flex gap-2 p-[20px]">
    <app-button [loading]="loading" (click)="save()" full impact="bold" tone="primary" shape="rounded" size="medium">Guardar</app-button>
    <app-button [disabled]="loading"  mat-dialog-close full impact="bold" tone="primary" shape="rounded" size="medium">Cerrar</app-button>
  </div>
</mat-dialog-actions>
