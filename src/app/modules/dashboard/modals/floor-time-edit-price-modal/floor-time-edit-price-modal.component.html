<mat-dialog-content class="!max-h-none">
  <div class="flex flex-col gap-5 p-5">
    <div class="flex items-start justify-between gap-4">
      <div class="flex flex-col gap-1">
        <p class="text-foreground text-[16px] font-semibold">Editar precio</p>
        <p class="text-muted-foreground text-[12px]">Actualiza el precio de venta del auto.</p>
      </div>
    </div>

    <div class="rounded-md border border-border bg-background px-3 py-2">
      <p class="text-muted-foreground text-[11px]">Auto</p>
      <p class="text-foreground text-[13px] font-semibold">{{ carLabel }}</p>
    </div>

    <form [formGroup]="saveForm" class="flex flex-col gap-2">
      <label class="text-foreground text-[11px] font-medium">Precio de venta:</label>
      <input
        type="text"
        class="h-[36px] rounded-md border border-border bg-background px-3 text-foreground text-[13px]"
        placeholder="Precio de venta"
        formControlName="sale_price"
        mask="separator.2"
        thousandSeparator=","
        decimalMarker="."
      />

      <ng-container *ngFor="let error of errorMessages.sale_price">
        <div
          class="text-[11px] text-red-500"
          *ngIf="saveForm.get('sale_price')?.hasError(error.type) && (saveForm.get('sale_price')?.dirty || saveForm.get('sale_price')?.touched)"
        >
          {{ error.message }}
        </div>
      </ng-container>
    </form>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <div class="flex gap-2 p-5 pt-0">
    <app-button
      [loading]="loading"
      [disabled]="loading"
      (click)="save()"
      full
      impact="bold"
      tone="primary"
      shape="rounded"
      size="medium"
    >
      Guardar
    </app-button>
    <app-button
      [disabled]="loading"
      (click)="close()"
      full
      impact="bold"
      tone="primary"
      shape="rounded"
      size="medium"
    >
      Cerrar
    </app-button>
  </div>
</mat-dialog-actions>
