<app-table
  [select]="true"
  [labelName]="'Cliente'"
  [selectValueDefault]="false"
  [selectValue]="'full_name'"
  [selectData]="clientData"
  [selectPlaceholder]="'Seleccione un cliente'"
  [selectId]="'id'"
  
  [searchable]="true"
  [size]="'lg'"
  [actions]="actions"
  [data]="collections"
  [headers]="collectionsHeader"
  [loading]="loading"
  [error]="error"
  [hasNext]="hasNext"
  [hasPrev]="hasPrev"
  [total]="total"
  [totalPages]="totalPages"
  [pages]="pages"
  [anchorsNext]="anchorsNext"
  [currentPage]="currentPage"
  [dataFilterColumns]="columns"
  (pageSizeSelectReturn)=pageSizeSelectReturn($event)
  (currentPageReturn)=currentPageReturn($event)
  (changePageNextPrevReturn)=changePageNextPrev($event)
  (searchData)=searchData($event)
  (action)="onRowAction($event)"
  (selectOptionReturn)="selectOptionReturn($event)"
></app-table>
